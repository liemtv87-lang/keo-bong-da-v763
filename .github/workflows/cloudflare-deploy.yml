name: Deploy R55 Pro to Cloudflare

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract R55
        run: |
          rm -rf deploy
          mkdir -p deploy
          unzip -q Keo_R55_FULL_FROM_R46-12.zip -d deploy
          APP_DIR="$(find deploy -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$APP_DIR"
          test -f "$APP_DIR/wrangler.jsonc"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Deploy R55 to Cloudflare
        run: |
          cd "$APP_DIR"
          npx wrangler@latest deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
