name: Deploy R55 Pro to Cloudflare

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract R55
        run: |
          rm -rf deploy
          mkdir -p deploy
          unzip -q Keo_R55_FULL_FROM_R46-5.zip -d deploy

      - name: Deploy R55 to Cloudflare
        working-directory: deploy/R55_FIXED
        run: npx wrangler@latest deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
