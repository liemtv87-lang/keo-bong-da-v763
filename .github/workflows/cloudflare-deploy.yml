name: Deploy R55 Pro to Cloudflare

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract R55
        run: |
          rm -rf deploy
          mkdir -p deploy
          unzip -q Keo_R55_FULL_FROM_R46-14.zip -d deploy
          WRANGLER_FILE="$(find deploy -type f -name wrangler.jsonc -print -quit)"
          test -n "$WRANGLER_FILE"
          APP_DIR="$(dirname "$WRANGLER_FILE")"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Detected R55 app directory: $APP_DIR"

      - name: Deploy R55 to Cloudflare
        run: |
          cd "$APP_DIR"
          npx wrangler@latest deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
